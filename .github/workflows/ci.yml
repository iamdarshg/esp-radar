name: CI

on:
  push:
    branches: [main]
  pull_request:

# The host-testable crates. The ESP32 firmware crates (firmware/radar_tx,
# firmware/radar_rx) are deliberately NOT tested here: they need the Espressif
# `esp` nightly-fork toolchain + ESP-IDF and build host-only on the dev machine
# (docs/verification.md). All `device`-featured code in the crates below is off
# by default, so they compile and test on a plain host.
#
# Toolchain: pinned to `nightly-2026-07-15` (matches the dev machine's default
# nightly, rustc d0babd8b6 2026-07-15). NOT stable — the workspace root
# Cargo.toml uses `cargo-features = ["panic-immediate-abort"]` (and
# `panic = "immediate-abort"` in [profile.release]), which is still
# nightly-gated and REQUIRED by the ESP-IDF firmware release profile (stable
# rejects the manifest outright).
#
# Host crates (the canonical list, repeated in the module matrix and the lint
# steps): radar_protocol radar_dsp radar_features radar_calibration
# radar_transport radar_csi radar_storage radar_web radar_ota radar_rp2350.
env:
  CARGO_TERM_COLOR: always

jobs:
  # Build + test each module as its own job (matrix).
  module:
    name: module / ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - radar_protocol
          - radar_dsp
          - radar_features
          - radar_calibration
          - radar_transport
          - radar_csi
          - radar_storage
          - radar_web
          - radar_ota
          - radar_rp2350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-15
      - uses: Swatinem/rust-cache@v2
      - name: Build & test ${{ matrix.crate }}
        run: cargo test -p ${{ matrix.crate }} --locked

  # One integration job: the three radar roles (tx, rx1, rx2) as separate OS
  # processes over loopback UDP — the inter-chip comms gate (14 assertions:
  # RATE-1/2/3 framing, CRC, seq, pairing, fusion).
  integration:
    name: integration (inter-chip comms, 14 assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-15
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/integration
      - name: Build integration tool
        run: cd tools/integration && cargo build --locked
      - name: Run three-role loopback orchestrate
        run: cd tools/integration && ./target/debug/integration --orchestrate --duration 8 --rate 200

  # Lint: rustfmt + clippy, scoped to the host crates (firmware never builds here).
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-15
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: |
          cargo fmt -p radar_protocol -p radar_dsp -p radar_features -p radar_calibration \
            -p radar_transport -p radar_csi -p radar_storage -p radar_web -p radar_ota \
            -p radar_rp2350 -- --check
      - name: clippy (deny warnings)
        run: |
          cargo clippy -p radar_protocol -p radar_dsp -p radar_features -p radar_calibration \
            -p radar_transport -p radar_csi -p radar_storage -p radar_web -p radar_ota \
            -p radar_rp2350 --locked -- -D warnings
